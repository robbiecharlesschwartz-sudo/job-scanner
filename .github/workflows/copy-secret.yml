# One-off, deleted right after use: seals RESEND_API_KEY with another repo's public Actions key
# so it can be stored there. The output is ciphertext only GitHub can open.
name: copy-secret
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "Target repo's Actions public key (base64)"
        required: true
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q pynacl
      - run: |
          python - <<'PY'
          import base64, os
          from nacl import encoding, public
          pk = public.PublicKey(os.environ["PK"].encode(), encoding.Base64Encoder())
          sealed = public.SealedBox(pk).encrypt(os.environ["SECRET"].encode())
          print("SEALED=" + base64.b64encode(sealed).decode())
          PY
        env:
          PK: ${{ inputs.public_key }}
          SECRET: ${{ secrets.RESEND_API_KEY }}
