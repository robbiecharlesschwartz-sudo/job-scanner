name: tests

# Runs the unit tests on every push and pull request. Separate from the scan so a failing test
# can never stop the daily scan; it just shows a red cross on the commit.
on:
  push:
    paths-ignore: ["state/**", "site/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/status.test.mjs
