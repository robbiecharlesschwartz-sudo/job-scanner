name: daily-scan

on:
  schedule:
    # Off the top of the hour: GitHub delays busy :00 schedules by hours. The second run is a
    # backup in case one is dropped; it never re-alerts (only unseen postings alert).
    - cron: "23 11 * * *"   # 7:23 AM EDT / 6:23 AM EST
    - cron: "47 15 * * *"   # 11:47 AM EDT / 10:47 AM EST
  workflow_dispatch:         # "Run workflow" button for a manual scan
    inputs:
      check_ai:
        description: "Only test which AI answers (no scan)"
        type: boolean
        default: false
      test_email:
        description: "Only send a test email (no scan)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: scan and rate, print what would be alerted, change nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan, rate, alert
        run: python -m scanner ${{ inputs.check_ai && '--check-ai' || '' }} ${{ inputs.test_email && '--test-email' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      # Cheap upkeep of company research: re-fetch the official pages of profiles that are due and
      # flag any that changed. No AI calls; a failure here never affects the scan.
      - name: Check company research sources
        if: ${{ !inputs.check_ai && !inputs.test_email && !inputs.dry_run }}
        continue-on-error: true
        timeout-minutes: 5
        run: python -m scanner.intel check

      # Commit even if alerts failed: the state must record what was seen, or tomorrow
      # would re-send everything. The push redeploys the results page on Vercel.
      # A check-off saved from the page between checkout and push makes the first push fail;
      # rebase and try again (the scanner never writes status.json, so there is no conflict).
      - name: Save state and results page
        if: always()
        run: |
          git config user.name "Robbie Schwartz"
          git config user.email "robbiecharlesschwartz@gmail.com"
          git add state site
          git diff --cached --quiet && exit 0
          git commit -m "Scan $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Alert if the scan failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: Job Scanner run failed" -H "Tags: warning" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Today's scan hit an error. Tap to see what happened; the next scheduled run will retry." \
            "https://ntfy.sh/$NTFY_TOPIC"
