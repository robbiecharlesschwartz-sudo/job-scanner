name: daily-scan

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 8 AM EDT / 7 AM EST
  workflow_dispatch: {}      # "Run workflow" button for a manual scan

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan, rate, alert
        run: python -m scanner
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      # Commit even if alerts failed: the state must record what was seen, or tomorrow
      # would re-send everything. The push redeploys the results page on Vercel.
      - name: Save state and results page
        if: always()
        run: |
          git config user.name "Robbie Schwartz"
          git config user.email "robbiecharlesschwartz@gmail.com"
          git add state site
          git diff --cached --quiet && exit 0
          git commit -m "Scan $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          git push
