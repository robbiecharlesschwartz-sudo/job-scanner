# Target companies. Add, remove, or re-prioritise freely.
#
# Every entry needs: name, priority (1 = highest), platform, plus that platform's fields.
# Set `enabled = false` to pause a company without deleting it.
#
# Platforms and their fields (one adapter per platform, see scanner/adapters.py):
#   greenhouse  board            -> boards-api.greenhouse.io/v1/boards/<board>/jobs
#   lever       board            -> api.lever.co/v0/postings/<board>
#   ashby       board            -> api.ashbyhq.com/posting-api/job-board/<board>
#   workday     tenant, host, site, [queries]   (host is the wdN part, e.g. "wd1")
#   oracle      host, site, [queries]           (Oracle HCM candidate experience)
#   avature     base, [queries]                 (Avature HTML search, e.g. Deloitte)
#   avature_rss base                            (Avature RSS feed; ~20 newest items only)
#   radancy     base, [queries]                 (Radancy/TalentBrew "search-jobs" sites)
#   jibe        base, [queries]                 (iCIMS Jibe sites with /api/jobs)
#   sourceflow  base                            (Sourceflow /_sf/api/v1/jobs/search.json)
#   yello       base, board                     (Yello / recsolu job boards)
#   ibm         category                        (IBM's careers search API)
#   kpmg        (no fields)                     (kpmguscareers.com listing)
#
# `associate_is_senior = true` skips "Associate" titles (post-MBA at banks) unless the posting
# says early-career.
# `queries` are server-side keyword searches. The big boards have thousands of postings,
# so they are searched rather than pulled whole. Leave queries out to pull everything.

