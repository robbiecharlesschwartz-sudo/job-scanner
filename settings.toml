# Scanner settings. Company list lives in companies.toml; your background lives in profile.md.

[site]
# Public URL of the results page (the Vercel deployment). Used for short links in texts.
url = "https://job-scanner-robbie.vercel.app"

[sms]
# Phone alerts go through ntfy (free push notifications). Every new match gets its own alert
# (tap opens the posting), followed by one summary alert that opens the results page.
# Past this many in one day (e.g. the first scan's backlog) the rest are only on the page.
max_listed = 25

[scoring]
# Ratings use Claude when ANTHROPIC_API_KEY is set, otherwise Groq's free tier (GROQ_API_KEY).
# Haiku 5.5 keeps this to pennies a month; "claude-opus-5-5" rates more carefully at ~40x the price.
model = "claude-haiku-5-5"
# Postings scored per Claude request.
batch_size = 6

[filters]
# Regexes, case-insensitive. The target (see profile.md): new-grad (0-1 yrs) roles based in NYC,
# starting after an April 2027 graduation, in three lanes - external consulting, in-house
# strategy, rotational/generalist programs - with business development as a looser fourth.

# Seniority / wrong-stage titles. Always disqualifying.
exclude_level = [
  '\bsenior\b', '\bsr\.?\b', '\bmanager\b', '\bdirector\b', '\bprincipal\b', '\bpartner\b',
  '\bhead of\b', '\bvice president\b', '\bvp\b', '\bsvp\b', '\bevp\b', '\blead\b', '\bmanaging\b',
  '\bexecutive\b', '\bexpert\b', '\bfellow\b', '\barchitect\b', '\bexperienced\b', '\bmba\b',
  '\bintern(ship)?\b', '\bco-?op\b', '\bsummer\b', '\bresidency\b', '\bapprentice',
  '\b(ii|iii|iv)\b', '\blevel [2-9]\b', '\bspecialist\s+(ii|iii)\b',
]

# Off-target work. Disqualifying unless the title is also ESG/sustainability/climate work.
exclude_domain = [
  'engineer', '\bdeveloper\b', 'software', 'data scien', 'cyber', 'security', '\bcloud\b',
  'devops', '\bsap\b', 'salesforce', 'workday', 'servicenow', '\boracle\b', 'dynamics',
  'anaplan', 'netsuite', 'guidewire', '\bpega', '\bit\b', 'technical', '\bsolutions?\b',
  'implementation', '\bapplication', '\bpackage\b', '\bdelivery\b', 'platform',
  '\baudit', 'assurance', '\btax\b', 'accounting', 'accountant', 'actuar', 'payroll',
  'forensic', '\baml\b', 'fraud', 'legal', 'paralegal', 'attorney', 'counsel',
  '\bsales\b', 'account executive', 'recruit', 'talent acquisition', '\bhr\b', 'clinical',
  'nurse', 'pharmac', 'medical', 'scientist', '\blab\b', 'manufacturing', 'support',
  'administrative', 'assistant', 'driver', 'warehouse', 'merchandis', 'clearance', 'ts/sci',
  '\bsecret\b', 'trader', 'trading', 'quant', 'investment banking', 'underwrit', 'loan',
  'credit', 'wealth', 'insurance', 'claims', 'customer success',
]
domain_rescue = ['sustainab', 'climate', '\besg\b', 'decarboni', 'net[- ]zero', 'energy transition']

# Adjacent work: not disqualifying, but caps the posting at Stretch.
stretch_domain = [
  'analytics', 'data analyst', 'insights', 'reporting', 'governance', '\brisk\b', 'compliance',
  'marketing', 'communications', 'content', 'design', 'product', 'portfolio', 'valuation',
  'financial due diligence', 'integration', 'technology',
]

# Lanes. The title must name one of these.
function_any = [
  'strateg', 'chief of staff', 'strategic initiatives', 'corporate development', 'bizops',
  'business operations', 'strategy (and|&) operations', "founder'?s associate", 'special projects',
  'internal consult', 'management consult', 'business consult', 'sustainab', 'climate', '\besg\b',
  'decarboni', 'parthenon', 'monitor deloitte', 'value creation', 'performance improvement',
  'rotational', 'rotation', 'leadership development', 'development program', 'graduate program',
  'analyst program', 'generalist', 'business development',
]
# Adjacent lane words (any company): pass, but rated no higher than Good/Stretch by the AI.
function_adjacent = [
  'strategic finance', 'fp&a', 'financial planning', '\bplanning\b', '\bprogram\b', '\bproject\b',
  'operations', 'business analyst', 'transformation', 'innovation', 'growth', 'partnerships',
]

# Extra lane words that only count at consulting firms (priority 1-2): there, these are the job.
function_consulting = ['consult', 'business analyst', 'transformation', 'operations', 'advisory']
consulting_priorities = [1, 2]

# Level words in the title. "consultant" counts only at consulting firms (Big 4 / Accenture use
# it for new grads); "associate" is skipped at banks unless marked early-career.
level_title = [
  '\banalyst\b', '\bassociate\b', '\bstaff\b', 'new grad', 'graduate', 'entry[- ]level', 'campus',
  '\b2027\b', 'class of', 'early career', '\bjunior\b', 'program\b',
]
level_title_consulting = ['\bconsultant\b']
early_markers = [
  'new grad', 'recent graduate', 'entry[- ]level', 'class of 2027', '2027 grad', 'graduating',
  'campus', 'undergraduate', '\b0\s*(-|–|to)\s*[12]\s*years', 'no prior (work )?experience',
  'early[- ]career', '\b2027\b',
]

# Description phrases that disqualify: 3+ years, an MBA / graduate degree, prior full-time work.
exclude_description = [
  '\b([3-9]|1[0-9])\s*\+?\s*(-|–|to)?\s*\d*\s*\+?\s*years?\b[^.]{0,50}\b(experience|exp\.)',
  '\b(minimum|at least|min\.?)( of)? ([3-9]|three|four|five|six|seven|eight|ten)\s*\+?\s*years',
  '\b(three|four|five|six|seven|eight|ten)\s*\(?\d*\)?\s*\+?\s*(or more )?years?\b[^.]{0,50}\bexperience',
  'mba (is |degree )?required', 'post[- ]mba', 'completed (an |your )?mba', 'current mba',
  '\b(have|hold|be pursuing|pursuing|completed?|possess|earned)\s+(an?\s+|your\s+)?(mba|master|graduate degree|advanced degree)',
  '\b(mba|graduate degree|advanced degree)\b[^.]{0,40}\b(required|must|necessary)',
  'prior full[- ]time (work |professional )?experience', 'mba (candidates|graduates|students)',
]

# Start-date / cohort mismatches: before an April 2027 graduation, or a 2028+ cohort.
# About 2 years asked for: slightly out of range -> Stretch at most.
stretch_description = [
  '\b(2|two)\s*\+?\s*(-|–|to)?\s*\d*\s*\+?\s*years?\b[^.]{0,50}\b(experience|exp\.)',
  '\b(minimum|at least|min\.?)( of)? (2|two)\s*\+?\s*years',
]

bad_start_title = [
  '\b2026\b', '\b(winter|spring|january|february|march)\s+2027\b', '\b2028\b', '\b2029\b',
]
bad_start_description = [
  'start\w*[^.\n]{0,40}\b(2026|(winter|spring|january|february|march)\s+2027|2028)\b',
  '\b(2026|(winter|spring|january|february|march)\s+2027|2028)\s+(start|cohort|class)',
  'available to start (immediately|asap)', 'immediate start',
]
