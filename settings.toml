# Scanner settings. Company list lives in companies.toml; your background lives in profile.md.

[site]
# Public URL of the results page (the Vercel deployment). Used for short links in texts.
url = "https://job-scanner-robbie.vercel.app"

[sms]
# Phone alerts go through ntfy (free push notifications). Every new match gets its own alert
# (tap opens the posting), followed by one summary alert that opens the results page.
# Past this many in one day (e.g. the first scan's backlog) the rest are only on the page.
max_listed = 25

[scoring]
# Ratings use Claude when ANTHROPIC_API_KEY is set, otherwise Groq's free tier (GROQ_API_KEY).
# Haiku 5.5 keeps this to pennies a month; "claude-opus-5-5" rates more carefully at ~40x the price.
model = "claude-haiku-5-5"
# Postings scored per Claude request.
batch_size = 12

[filters]
# Regexes are case-insensitive and matched against the job title unless noted.

# Seniority that rules a posting out.
exclude_title = [
  '\bsenior\b', '\bsr\.?\b', '\bmanager\b', '\bdirector\b', '\bprincipal\b', '\bpartner\b',
  '\bhead of\b', '\bvice president\b', '\bvp\b', '\bsvp\b', '\bevp\b', '\bexecutive director\b',
  '\blead\b', '\barchitect\b', '\bfellow\b', '\bexpert\b', '\bmanaging\b',
  '\bintern(ship)?\b', '\bco-?op\b', '\bsummer\s+(scholar|leadership)\b', '\bresidency\b',
  '\bsoftware engineer\b', '\bdeveloper\b', '\bengineer\b', '\bdata scientist\b',
  '\bnurse\b', '\bpharmacist\b', '\btechnician\b', '\bmechanic\b', '\bdriver\b',
  '\baudit\b', '\btax\b', '\baccountant\b', '\bpayroll\b', '\bsales representative\b',
  '\baccount executive\b', '\brecruit', '\bparalegal\b', '\battorney\b', '\bcounsel\b',
  '\bsummer\s+(associate|analyst|consultant|20\d\d)\b', '\badministrative\b', '\bassistant\b',
  '\bsales associate\b', '\bmerchandis', '\bwarehouse\b', '\bactuar', '\bsoc\b',
  'talent acquisition', '\bcost accounting\b', '\bfood (services|safety)\b',
  '\bexperienced\b', 'sales development', '\brepresentative\b',
  '\b(software|data|cyber software) engineering\b', '\bfreelance\b',
]

# Function: at least one must match the title (or, for "maybe" terms, the description).
function_title = [
  'consult', 'strateg', 'transformation', 'sustainab', 'climate', '\besg\b', 'decarboni',
  'strategy (and|&) operations', 'business operations', 'operations (analyst|associate)',
  '\bbizops\b', 'chief of staff', "founder'?s associate", 'corporate development', 'advisory',
  'management consult', 'business analyst', 'deal', 'value creation', 'performance improvement',
  'parthenon', 'monitor deloitte', 'special projects', 'internal consulting',
]

# Companies at these priorities need a target function in the title; an early-career level
# alone ("Associate", "Analyst") isn't enough at a non-consulting employer.
require_function_priorities = [3]

# Level signals that make a posting a clear early-career match.
early_career = [
  '\banalyst\b', '\bassociate\b', 'new grad', 'graduate', 'entry[- ]level', 'early career',
  'campus', '\b2027\b', 'class of', '\bjunior\b', '\bstaff\b', 'level 1', '\bl1\b',
  'associate consultant', 'business analyst', 'consultant i\b',
]

# Description text that rules a posting out (years of experience above the 0-2 range).
exclude_description = [
  '\b([3-9]|1[0-9])\+?\s*(\-|to|–)?\s*\d*\s*\+?\s*years?\b[^.]{0,40}\b(experience|exp\.)',
  'minimum of ([3-9]|three|four|five|six|seven|eight|ten) years',
  'at least ([3-9]|three|four|five|six|seven|eight|ten) years',
]

# Start dates before summer 2027 -> flag (not drop).
early_start_title = [
  '\b2026\b', '\b(winter|spring|january|february|march|april)\s+2027\b',
]
early_start_description = [
  'start\w*[^.\n]{0,40}\b(2026|(winter|spring|january|february|march|april|may)\s+2027)\b',
  '\b(2026|(winter|spring|january|february|march|april)\s+2027)\s+start',
  'immediate(ly)? start', 'start (date )?asap',
]
